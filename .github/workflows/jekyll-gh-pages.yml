name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/assets/css _site/assets/js _site/assets/fonts _site/files/research-figures _site/images/research
          cp index.html research.html publications.html cv.html 404.html robots.txt sitemap.xml .nojekyll _site/
          cp assets/css/site.css _site/assets/css/
          cp assets/js/site.js _site/assets/js/
          cp assets/fonts/fa-solid-900.woff2 assets/fonts/fa-brands-400.woff2 assets/fonts/academicons.woff _site/assets/fonts/
          cp files/Caifen_Liu_CV.pdf _site/files/
          cp files/research-figures/*.pdf _site/files/research-figures/
          cp images/caifen-liu-profile-long.JPG _site/images/
          cp images/research/*.png _site/images/research/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
